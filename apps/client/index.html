<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>supaboard | Feedback Board</title>
  <link href="index.css" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="supaboard" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#ffffff" id="theme-color-meta" />
  <script>
    const path = window.location.pathname;

    const isAdminRoute = path.startsWith("/admin");
    const adminTheme = localStorage.getItem("adminCurrentTheme");
    const userTheme = localStorage.getItem("currentTheme");

    const theme =
      isAdminRoute && adminTheme !== null
        ? adminTheme
        : userTheme !== null
          ? userTheme
          : window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";

    document.documentElement.classList.toggle("dark", theme === "dark");

    const themeColor = theme === "dark" ? "#18181b" : "#ffffff";
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) {
      meta.setAttribute("content", themeColor);
    }
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
